name: custom-response-url-guardrail
displayName: Custom Response URL Guardrail
version: v1.0.0
description: >
  Extracts HTTP and HTTPS URLs from assistant content, blocks private and
  reserved destinations, and optionally verifies HTTP reachability.
parameters:
  type: object
  additionalProperties: false
  properties:
    urlOnlyDNS:
      type: boolean
      default: false
    urlTimeoutMs:
      type: integer
      minimum: 100
      maximum: 30000
      default: 5000
    maximumURLs:
      type: integer
      minimum: 1
      maximum: 100
      default: 10
    maxResponseBodySize:
      type: integer
      minimum: 1
      default: 4194304
    failClosedUnexpectedResponse:
      type: boolean
      default: true
    showAssessment:
      type: boolean
      default: true
systemParameters:
  type: object
  additionalProperties: false
  properties: {}
